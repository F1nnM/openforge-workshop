name: PR Preview

# Builds every PR's frontend and uploads it as a Worker *version* — never a
# deployment — so a reviewer gets a live URL without touching staging's or
# production's traffic. `wrangler versions upload` is Cloudflare's own
# mechanism for exactly this: a version is visible only at its preview URL
# until something explicitly promotes it with `wrangler versions deploy`,
# which nothing in this workflow does.
#
# It reuses the `staging` Worker and its GitHub Environment secrets rather than
# provisioning a third Worker — versions never go live on their own, so
# uploading one against `openforge-workshop-staging` cannot disturb what
# staging actually serves. This is the same choice Cloudflare's own dashboard
# Git integration makes for non-production branches.
#
# `ci.yml` already runs on every pull request and gates lint, typecheck, the
# full test suite and a build — this workflow does not repeat any of that. Its
# job is "show a reviewer what this looks like", not "prove it's correct", and
# `npm run build` still fails outright on a type error, so a broken PR gets no
# preview rather than a silently stale one.
#
# ## The URL requires sign-in, and that is Cloudflare Access, not this workflow
#
# Every preview URL of `openforge-workshop-staging` sits behind a Cloudflare
# Access application scoped to a `preview_worker` destination on that one
# Worker — its production route is a separate destination and is not gated.
# That policy lives in the Cloudflare dashboard (Access → Applications →
# "OpenForge Workshop — PR previews"), not in this repo, because it is a
# statement about who may view a preview rather than about how one is built.
#
# ## What happens when the PR closes, and what does not
#
# **There is no way to take the preview itself down, on this PR or any other.**
# Checked directly rather than assumed: neither `wrangler versions` /
# `wrangler deployments` nor the Workers REST API (`GET`/`POST` only on
# `.../versions`, no `DELETE`, and no endpoint for a preview alias at all)
# exposes a way to delete or disable one version or one alias. A version, once
# uploaded, is permanent; the only related lever is disabling Preview URLs for
# the *whole* Worker, which would take every PR's preview down at once, or
# Cloudflare Access in front of all of them. Neither is a per-PR action, so
# neither belongs in this workflow.
#
# What the `close` job below does instead is the honest version of "take it
# down": it edits the same sticky comment to say the preview is closed, so a
# reviewer scrolling the PR later does not mistake a stale build for a current
# one. The URL itself keeps resolving — until its alias eventually ages out of
# the 1,000 most recently deployed, which Cloudflare evicts automatically —
# and that is a documented platform limit, not an oversight here.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# A push to the same PR supersedes its own in-flight preview build, so the
# older one is cancelled rather than left to finish and post a stale comment
# after the newer one already has. Closing the PR falls in the same group, so
# a build already running when the PR closes does not race the comment the
# `close` job is about to make stale.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Only the four events that mean "build and show me this PR". `closed` is
    # the fifth member of the trigger above and belongs to the `close` job
    # below instead.
    if: github.event.action != 'closed'
    # `pull_request` (not `pull_request_target`) withholds repository secrets
    # from a fork's PRs regardless of this environment, so a fork PR builds
    # nothing here rather than running untrusted code against real
    # credentials. That is the safe default, not a gap to close.
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      # Same pin CI and the deploy job use, for the same reason: with the
      # clock pinned to the commit, `version.built` is a property of the
      # commit rather than of when this job happened to run.
      - name: Pin the build clock
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@v3

      - run: npm ci

      # Lifted from `ci.yml` and `deploy.yml`: `public/catalog/catalog.json` is
      # gitignored and derived, so a checkout never carries it, and building
      # without it ships a preview with an empty catalog — a worse failure than
      # no preview at all, because it looks like a working deploy.
      - name: Fetch catalog fixtures
        run: |
          set -euo pipefail
          . .github/fixtures.env
          DEST="${RUNNER_TEMP}/openforge-catalog"
          git clone --quiet --filter=blob:none --no-checkout --sparse \
            "https://github.com/${OPENFORGE_CATALOG_REPO}.git" "$DEST"
          git -C "$DEST" sparse-checkout set --no-cone "${OPENFORGE_FIXTURES_PATH}"
          git -C "$DEST" checkout --quiet "${OPENFORGE_CATALOG_SHA}"
          FIXTURES="${DEST}/${OPENFORGE_FIXTURES_PATH}"
          test -d "$FIXTURES"
          echo "OPENFORGE_FIXTURES=${FIXTURES}" >> "$GITHUB_ENV"
          echo "OPENFORGE_FIXTURES_COMMIT=${OPENFORGE_CATALOG_SHA}" >> "$GITHUB_ENV"

      - name: Regenerate and stamp the derived artefacts
        run: npm run stamp

      - name: Build
        run: npm run build

      # The alias is the PR number, so the URL is stable across every push to
      # this PR — a reviewer bookmarks it once. Wrangler's own machine-readable
      # log (`WRANGLER_OUTPUT_FILE_PATH`) is read for the URL rather than
      # scraping the human-readable console output: it is the interface
      # Cloudflare documents for exactly this, and it survives a wording change
      # to the printed summary that would otherwise silently break a regex.
      #
      # Filtered on the alias prefix rather than taken as "the first URL in the
      # file": a version upload emits *two* preview URLs (the version-specific
      # one and the alias), and only the alias is the stable link this step
      # hands to the comment step below.
      #
      # `npx wrangler` directly rather than `cloudflare/wrangler-action`, which
      # `deploy.yml` uses: that job's `deploy` never needs anything back beyond
      # its own exit code, where this one has to read a specific field out of
      # the run, and `WRANGLER_OUTPUT_FILE_PATH` is the documented way to get
      # one regardless of what invokes wrangler. Auth is the same two secrets
      # either way, just read from the environment instead of the action's
      # `apiToken`/`accountId` inputs.
      - name: Upload a preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          set -euo pipefail
          alias="pr-${{ github.event.pull_request.number }}"
          npx wrangler versions upload --env staging --preview-alias "$alias"

          # `-m1` rather than `| head -1`: piping into `head` under `set -o
          # pipefail` risks grep dying to SIGPIPE once `head` closes its end,
          # which `pipefail` would then report as this step's exit code.
          # `|| true` keeps a no-match from tripping `set -e` before the
          # friendly error below gets to run.
          url=$(grep -m1 -oE "https://${alias}-[a-zA-Z0-9.-]*\.workers\.dev" \
            "$WRANGLER_OUTPUT_FILE_PATH" || true)
          if [ -z "$url" ]; then
            echo "::error::no preview alias URL found in wrangler's output log"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # One comment per PR, updated in place across pushes — the marker is
      # what `github-script` searches for. Cloudflare's own dashboard
      # integration does the same thing for a connected repo; this is the
      # equivalent for a repo that deploys through GitHub Actions instead.
      - name: Comment the preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-bot -->'
            const url = ${{ toJSON(steps.upload.outputs.url) }}
            const body = `${marker}\n**Preview:** ${url}\n\nUpdates automatically on every push to this PR.`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((comment) => comment.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  # Runs on merge and on a plain close alike — both mean this PR's preview is
  # no longer the thing to look at. See the module note above for what this
  # can and cannot do: Cloudflare gives no way to take the version or its alias
  # down, so this edits the same sticky comment to say so rather than leaving
  # a stale "here's your preview" sitting on a closed PR looking current.
  close:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark the preview comment closed
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-bot -->'
            const merged = ${{ toJSON(github.event.pull_request.merged) }}

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            // Nothing to mark closed if no preview ever posted — a fork PR, or
            // one closed before its first build finished.
            const existing = comments.find((comment) => comment.body?.includes(marker))
            if (!existing) return

            // The URL the last successful build posted, pulled back out of
            // that comment rather than re-derived, so this job needs no
            // Cloudflare credentials of its own. Kept and still linked, just
            // relabelled: the URL still resolves (Cloudflare gives no way to
            // stop it — see the workflow's own note) and hiding it here would
            // only make it harder to find, not less live.
            const match = existing.body.match(/\*\*Preview:\*\* (\S+)/)
            const url = match?.[1] ?? '(URL not found in the previous comment)'
            const body = `${marker}\n**Preview closed** — this PR was ${merged ? 'merged' : 'closed'}, ` +
              `so ${url} is no longer maintained and will not update. It may still resolve — ` +
              `Cloudflare has no way to take a specific preview down — but nothing here keeps it in sync with \`main\`.`

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            })
