name: CI

on:
  push:
    branches: [main, 'epic/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3

      - run: npm ci

      # The corpus suites — pipeline, materials, assembly, search — are the ones
      # that verify claims against real data rather than handcrafted fixtures.
      # Without this they skip, and a green board that ran 9 of 33 tests is
      # worse than a red one.
      - name: Fetch catalog fixtures
        id: fixtures
        run: |
          set -euo pipefail
          . .github/fixtures.env
          DEST="${RUNNER_TEMP}/openforge-catalog"
          git clone --quiet --filter=blob:none --no-checkout --sparse \
            "https://github.com/${OPENFORGE_CATALOG_REPO}.git" "$DEST"
          git -C "$DEST" sparse-checkout set --no-cone "${OPENFORGE_FIXTURES_PATH}"
          git -C "$DEST" checkout --quiet "${OPENFORGE_CATALOG_SHA}"
          FIXTURES="${DEST}/${OPENFORGE_FIXTURES_PATH}"
          test -d "$FIXTURES"
          echo "count=$(find "$FIXTURES" -name '*.json' | wc -l)" >> "$GITHUB_OUTPUT"
          echo "OPENFORGE_FIXTURES=${FIXTURES}" >> "$GITHUB_ENV"

      - name: Build the catalog index
        run: npm run import:catalog

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails if a suite that should have run against the corpus was skipped
      # instead — the failure mode this whole job exists to prevent.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify catalog facts
        run: python3 docs/verify-catalog-facts.py "$OPENFORGE_FIXTURES"

      - name: Summary
        if: always()
        run: |
          . .github/fixtures.env
          {
            echo "### Corpus"
            echo ""
            echo "- fixtures: \`${OPENFORGE_CATALOG_REPO}@${OPENFORGE_CATALOG_SHA:0:12}\`"
            echo "- fixture files: ${{ steps.fixtures.outputs.count }}"
          } >> "$GITHUB_STEP_SUMMARY"
